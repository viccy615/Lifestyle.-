<style>
:root{--bg:#FAF8F5;--card:#F3EFEA;--tx:#3B2F2A;--mut:#8F7F73;--ac:#5C6E4B;--ln:#E6DED5;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A211D;--card:#372C26;--tx:#F0E8DF;--mut:#B3A294;--ln:#4A3C34}}
:root[data-theme="dark"]{--bg:#2A211D;--card:#372C26;--tx:#F0E8DF;--mut:#B3A294;--ln:#4A3C34}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.45 'DM Sans',system-ui,sans-serif}
#main{padding:20px 20px 110px;max-width:560px;margin:auto}
h1{font:500 38px/1.05 'Cormorant Garamond',Georgia,serif;margin:6px 0 2px}
.sub{color:var(--mut);margin:0 0 18px}.hd{display:flex;justify-content:space-between;align-items:flex-start}
.mn,.bk{background:none;border:0;color:var(--mut);font-size:22px;padding:8px}.bk{font-size:15px;padding:0 0 6px;display:block}
.card{background:var(--card);border-radius:22px;padding:16px 18px;margin:0 0 12px;box-shadow:0 1px 8px rgba(80,55,40,.06)}
.card h3{margin:0 0 8px;font:500 23px 'Cormorant Garamond',Georgia,serif}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:5px 0}.t{color:var(--mut);font-size:14px;min-width:92px}
.bar{height:8px;border-radius:8px;background:var(--ln);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:8px;transition:width .7s ease}
small,.m{color:var(--mut);font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;width:100%;box-sizing:border-box;margin:3px 0}
textarea{min-height:64px;resize:vertical}
.btn{background:var(--ac);color:var(--on,#fff);border:0;border-radius:999px;padding:14px;width:100%;font-weight:500;margin-top:8px}
